name: CI Pipeline

on:
  push:
    branches: [ "main" ] # Triggers whenever you push code to the main branch
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download code from the repo into the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install dependencies located inside the app folder
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # Step 4: Run your tests (test_app.py) inside the app folder
      - name: Run Tests
        run: |
          pytest app/test_app.py || python -m pytest app/test_app.py

  build-and-push-docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Build the Docker image LOCALLY on the runner first (push: false)
      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          load: true # This loads the image into the local Docker daemon so Trivy can see it
          tags: |
            sumitsinghrmga/eks-gitops-demo:latest
            sumitsinghrmga/eks-gitops-demo:${{ github.sha }}

      # 2. Scan the local image BEFORE pushing
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sumitsinghrmga/eks-gitops-demo:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Fails the pipeline right here if vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 3. Log into Docker Hub ONLY after the scan passes successfully
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.SUMITSINGHRMGA }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Final Step: Push the safe image to Docker Hub
      - name: Push Docker Image to Registry
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            sumitsinghrmga/eks-gitops-demo:latest
            sumitsinghrmga/eks-gitops-demo:${{ github.sha }}
