name: CI Pipeline

on:
  push:
    branches: [ "main" ] # Triggers whenever you push code to the main branch
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download code from the repo into the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install dependencies located inside the app folder
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # Step 4: Run your tests (test_app.py) inside the app folder
      - name: Run Tests
        run: |
          pytest app/test_app.py || python -m pytest app/test_app.py

  build-and-push-docker:
    needs: build-and-test # This stage runs ONLY if the tests pass successfully
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 5: Log into Docker Hub using secrets configured in GitHub Settings
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.sumitsinghrmga }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 6: Build the Docker image from app/Dockerfile and push to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app # Targets the app/ directory where Dockerfile resides
          file: ./app/Dockerfile
          push: true
          # Replace 'your-dockerhub-username' with your actual Docker Hub profile username
          tags: |
            sumitsinghrmga/eks-gitops-demo:latest
            sumitsinghrmga/eks-gitops-demo:${{ github.sha }}
